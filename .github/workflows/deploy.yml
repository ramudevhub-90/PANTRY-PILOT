# Test, build and deploy Pantry Pilot to AWS on every push to main.
#
# No AWS keys are stored anywhere: GitHub signs in to AWS with a short-lived OIDC token and assumes
# the role in vars.AWS_DEPLOY_ROLE_ARN, which only trusts this repository's main branch.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Secret   ORIGIN_SECRET       value of infra/.origin-secret (lets CloudFront reach the server)
#   Secret   DEMO_CODE           optional fixed 6-digit sign-in code for the judges' demo account
# Optional variables override the defaults below (role ARNs and the domain are IDs, not secrets):
#   AWS_DEPLOY_ROLE_ARN, DOMAIN, SES_ROLE_ARN, NOVA_ROLE_ARN

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Server tests
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e . pytest httpx
          # Failures also go out as annotations, readable without signing in to GitHub.
          set +e
          .venv/bin/pytest -q -rf --tb=line 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|^/.*:[0-9]+: " pytest.log | head -9 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          python -m venv server/.venv
          npm ci --prefix web
          npm ci --prefix infra

      - name: Origin secret
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          if [ -z "$ORIGIN_SECRET" ]; then echo "::error::Set the ORIGIN_SECRET repository secret"; exit 1; fi
          umask 077
          printf '%s' "$ORIGIN_SECRET" > infra/.origin-secret

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::992189742260:role/PantryPilotGitHubDeploy' }}
          aws-region: us-east-1

      - name: Deploy
        working-directory: infra
        env:
          DOMAIN: ${{ vars.DOMAIN || 'trypantrypilot.com' }}
          SES_ROLE_ARN: ${{ vars.SES_ROLE_ARN || 'arn:aws:iam::975138397215:role/PantryPilotSesSender' }}
          NOVA_ROLE_ARN: ${{ vars.NOVA_ROLE_ARN || 'arn:aws:iam::234951664889:role/PantryPilotBedrockAccess' }}
          DEMO_CODE: ${{ secrets.DEMO_CODE }}
          WHATSAPP_PHONE_ID: ${{ vars.WHATSAPP_PHONE_ID || 'phone-number-id-3903c68c6bc24fc09bde596f9ebf8aaa' }}
        run: |
          args=()
          [ -n "$DOMAIN" ] && args+=(-c "domain=$DOMAIN")
          [ -n "$SES_ROLE_ARN" ] && args+=(-c "sesRole=$SES_ROLE_ARN")
          [ -n "$NOVA_ROLE_ARN" ] && args+=(-c "novaRole=$NOVA_ROLE_ARN")
          [ -n "$WHATSAPP_PHONE_ID" ] && args+=(-c "whatsappPhone=$WHATSAPP_PHONE_ID")
          npm run deploy -- "${args[@]}"

      - name: Remove origin secret
        if: always()
        run: rm -f infra/.origin-secret
